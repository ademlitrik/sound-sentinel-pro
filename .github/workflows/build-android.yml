name: Build Android APK (Sound Sentinel Pro Mobile)

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Initialize Capacitor Android Platform
        run: |
          cd mobile
          npx cap add android
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/Sound-Sentinel-Pro-Mobile.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sound-Sentinel-Pro-Android-APK
          path: mobile/Sound-Sentinel-Pro-Mobile.apk
          if-no-files-found: error

      - name: Publish Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: mobile/Sound-Sentinel-Pro-Mobile.apk

